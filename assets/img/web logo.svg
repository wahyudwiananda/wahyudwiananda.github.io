<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Lingkaran Gelap Cyber -->
  <rect width="512" height="512" rx="100" fill="#030712"/>
  
  <!-- Efek Glow / Pendaran di Tengah -->
  <circle cx="256" cy="256" r="120" fill="#00ffaa" opacity="0.15" filter="blur(20px)"/>
  
  <!-- Struktur Jalur Sirkuit Utama (IoT & Network Nodes) -->
  <g stroke="#00ffaa" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Kotak Inti Prosesor -->
    <rect x="176" y="176" width="160" height="160" rx="24" stroke-width="16"/>
    
    <!-- Jalur Bus / Sirkuit Keluar -->
    <line x1="256" y1="90" x2="256" y2="176" />
    <line x1="256" y1="336" x2="256" y2="422" />
    <line x1="90" y1="256" x2="176" y2="256" />
    <line x1="336" y1="256" x2="422" y2="256" />
    
    <!-- Jalur Diagonal (Informatika / Jaringan) -->
    <polyline points="130,130 200,200" />
    <polyline points="382,382 312,312" />
  </g>
  
  <!-- Titik-Titik Node Sensor IoT (Glow Mint) -->
  <g fill="#00ffaa">
    <circle cx="256" cy="90" r="16" />
    <circle cx="256" cy="422" r="16" />
    <circle cx="90" cy="256" r="16" />
    <circle cx="422" cy="256" r="16" />
    <circle cx="130" cy="130" r="16" />
    <circle cx="382" cy="382" r="16" />
    
    <!-- Inti Data di Tengah (Core System) -->
    <circle cx="256" cy="256" r="28" />
  </g>
</svg>
